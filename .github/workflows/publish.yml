name: Deploy to MonsterASP.NET
on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --output ./publish

      - name: Deploy to MonsterASP via WebDeploy
        shell: pwsh
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          
          $dest = "contentPath='${{ secrets.WEBSITE_NAME }}',computerName='${{ secrets.SERVER_COMPUTER_NAME }}',userName='${{ secrets.SERVER_USERNAME }}',password='${{ secrets.SERVER_PASSWORD }}',authType='Basic'"
          
          $args = @(
            "-verb:sync",
            "-source:contentPath='./publish'",
            "-dest:$dest",
            "-allowUntrusted",
            "-enableRule:AppOffline",
            "-retryAttempts:3"
          )
          
          & $msdeploy $args
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Deployment failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
