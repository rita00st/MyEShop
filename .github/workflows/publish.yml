name: Build and Deploy to MonsterASP

on:
  push:
    branches: [ "master" ]

jobs:
  build_and_deploy:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # اگر نسخه پروژه‌ات 9 است، این را به 9.0.x تغییر بده

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Publish
      run: dotnet publish --configuration Release --output ./publish

    - name: Deploy to MonsterASP via WebDeploy
      shell: powershell
      run: |
        $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
        
        # استفاده از آدرس کامل پوشه publish
        $source = (Get-Item "./publish").FullName
        
        # دریافت مقادیر از Secrets گیت‌هاب
        $siteName = "${{ secrets.WEBSITE_NAME }}"
        $computerName = "${{ secrets.SERVER_COMPUTER_NAME }}"
        $userName = "${{ secrets.SERVER_USERNAME }}"
        $password = "${{ secrets.SERVER_PASSWORD }}"

        # ساخت رشته مقصد
        $dest = "contentPath='$siteName',computerName='$computerName',userName='$userName',password='$password',authType='Basic'"

        # اجرای دستور با آرگومان‌های تفکیک شده
        & $msdeploy `
          -verb:sync `
          -source:contentPath="$source" `
          -dest:$dest `
          -allowUntrusted `
          -disableLink:AppPoolExtension `
          -disableLink:ContentExtension `
          -disableLink:CertificateExtension

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Deployment failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
        }
